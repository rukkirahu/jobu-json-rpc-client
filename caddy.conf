https://jobu.local.dev {

    # Root redirect: authenticated users go to /app/, others to the static landing page.
    # Adjust the cookie name below to match your Authelia session cookie name.
    # @root_authed {
    #     path /
    #     header Cookie *auth*
    # }
    # redir @root_authed /app/ 302
    # redir / /index.html 302

    # redir /app /app/ 308

    # forward_auth /app/* https://auth.local.dev {
    #     uri /api/authz/forward-auth
    #     ## The following commented line is for configuring the Authelia URL in the proxy. We strongly suggest
    #     ## this is configured in the Session Cookies section of the Authelia configuration.
    #     # uri /api/authz/forward-auth?authelia_url=https://auth.example.com/
    #     copy_headers Remote-User Remote-Groups Remote-Email Remote-Name HX-Request
    # }

    # Set this path to your site's directory.
    root * /var/www/jobu-php/public

    # reverse_proxy 127.0.0.1:8080
    # tls /etc/caddy/certs/_wildcard.local.dev.pem /etc/caddy/certs/_wildcard.local.dev-key.pem
    tls internal

    # Enable the static file server.
    file_server

    # Or serve a PHP site through php-fpm:
    php_fastcgi unix//run/php/php8.5-zend-fpm.sock
    # encode gzip
}
